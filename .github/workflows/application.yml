name: Application

on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: 8

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: true
        add-job-summary: never

    - name: Check license headers
      run: ./gradlew checkLicenses

  test:
    runs-on: ${{ matrix.runner }}
    needs: ci
    # Windows (aarch64) Java 8 runs as x64 under emulation, which is much slower
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
        - java-version: 23
          os: "windows-latest"
          arch: arm64
          runner: windows-11-arm
          expander_leg: windows-latest-23-arm64
    name: Java ${{ matrix.java-version }} (${{ matrix.os }}) Tests [${{ 
      matrix.expander_leg }}]
    steps:
    - uses: actions/checkout@v4

      # The Windows (aarch64) runner has no JDK 17, which Gradle needs as the compiler toolchain,
      # so provide one. Temurin has no Windows (aarch64) JDK 17, so use the Microsoft build there.
      # Java 8 doesn't exist for temurin on Windows (aarch64), so Java 8 runs as x64 under emulation
      # and Gradle then looks for an x64 JDK 17 instead.
    - name: Set up JDK 17 toolchain
      id: jdk17-toolchain
      if: ${{ matrix.os == 'windows-latest' && matrix.arch == 'arm64' }}
      uses: actions/setup-java@v4
      with:
        distribution: ${{ matrix.java-version == '8' && 'temurin' || 'microsoft'
          }}
        java-version: 17
        architecture: ${{ matrix.java-version == '8' && 'x64' || 'aarch64' }}

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
          # MacOS (aarch64) Java 8 doesn't exist for temurin, so use zulu instead
        distribution: ${{ matrix.os =='macos-latest' && matrix.java-version == 
          '8' && 'zulu' || 'temurin' }}
        java-version: ${{ matrix.java-version }}
          # Windows (aarch64) Java 8 doesn't exist for temurin, so use the x64 build (runs under Windows on Arm x64 emulation)
        architecture: ${{ matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java-version == '8' && 'x64' || '' }}

    - name: Register JDK 17 toolchain with Gradle
      if: ${{ steps.jdk17-toolchain.outcome == 'success' }}
      shell: bash
      run: |
        printf '\norg.gradle.java.installations.paths=%s\n' "$(cygpath -m '${{ steps.jdk17-toolchain.outputs.path }}')" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: true
        add-job-summary: never

    - name: Run Unit Tests
      run: ./gradlew --no-daemon test

    - name: Run UI Tests
      uses: GabrielBB/xvfb-action@v1
      continue-on-error: true
      with:
        run: ./gradlew --no-daemon uiTest

